<body>

<header class="header" id="header">
  <div class="header__inner">
    <a class="brand" href="https://agunechemba.github.io/" aria-label="Agunechemba home">
      <img
        class="brand__logo"
        src="https://agunechembaekene.wordpress.com/wp-content/uploads/2026/09/agunechemba-ekene-dp-small.png"
        alt=""
        width="34"
        height="34"
        loading="eager"
        decoding="async"
      />
      <span class="brand__name">Agunechemba<span> Ekene</span></span>
    </a>

    <nav class="nav">
      <a href="https://agunechemba.name.ng/PPH" target="_blank" rel="noopener noreferrer">PPH</a>
      <a href="https://www.linkedin.com/in/agunechembaekene/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://wa.me/2349066115252" class="cta" target="_blank" rel="noopener noreferrer">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">Published</p>
    <h1>projects</h1>
  </section>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input class="search__input" id="projectSearch" type="search"
             placeholder="Find a project…" aria-label="Search projects"
             autocomplete="off" />
    </div>
  </div>

  <section class="posts" id="projects">
    <p class="empty" id="loading">Loading GitHub Pages projects…</p>
  </section>
</main>

<footer class="footer" id="about">
  <div class="footer__inner">
    <p style="margin:0">&copy; <span id="year"></span> Agunechemba Ekene</p>
    <p style="margin:0">
      <a href="https://agunechemba.github.io/feed.xml" target="_blank" rel="noopener noreferrer">RSS</a> ·
      <a href="https://github.com/agunechemba" target="_blank" rel="noopener noreferrer">GitHub</a> ·
      <a href="mailto:agunechemba@yahoo.com" target="_blank" rel="noopener noreferrer">Email</a>
    </p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- header scrolled state ---------- */
  const header = document.getElementById('header');
  const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 8);
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- GitHub Pages discovery ---------- */
  (async function loadGitHubPagesProjects() {
    const grid    = document.getElementById('projects');
    const loading = document.getElementById('loading');
    const input   = document.getElementById('projectSearch');
    const API     = 'https://api.github.com/users/agunechemba/repos?per_page=100';
    const CACHE_KEY = 'gh-pages-projects';
    const CACHE_TTL = 60 * 60 * 1000; // 1 hour

    /* Try cache first */
    let repos = null;
    try {
      const cached = sessionStorage.getItem(CACHE_KEY);
      if (cached) {
        const { data, ts } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) repos = data;
      }
    } catch (_) { /* ignore cache errors */ }

    /* Fetch if needed */
    if (!repos) {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const all = await res.json();
        /* Keep only repos with Pages enabled, exclude the main user-page repo */
        repos = all.filter(r => r.has_pages && r.name !== 'agunechemba.github.io');
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data: repos, ts: Date.now() }));
      } catch (err) {
        console.error(err);
        loading.textContent = 'Could not load projects from GitHub. Please try again later.';
        return;
      }
    }

    if (!repos.length) {
      loading.textContent = 'No GitHub Pages projects found.';
      return;
    }

    /* Build cards */
    const cardsHTML = repos.map(r => {
      const url = r.homepage || `https://agunechemba.github.io/${r.name}/`;
      const description = r.description || 'No description provided.';
      const lang = r.language || 'Code';
      const topics = (r.topics || []).slice(0, 4)
        .map(t => `<li class="tag">${t}</li>`).join('');
      const year = r.created_at ? new Date(r.created_at).getFullYear() : '';

      return `
        <article class="card">
          <div class="card__meta">
            ${year ? `<span>${year}</span><span class="sep">·</span>` : ''}
            <span>${lang}</span>
          </div>
          <h2 class="card__title">
            <a class="card__link" href="${url}" target="_blank" rel="noopener noreferrer">
              ${r.name}
            </a>
          </h2>
          <p class="card__excerpt">${description}</p>
          ${topics ? `<ul class="card__tags">${topics}</ul>` : ''}
        </article>
      `;
    }).join('');

    loading.remove();
    grid.insertAdjacentHTML('beforeend', cardsHTML);

    /* ---------- search filter ---------- */
    const cards = Array.from(grid.querySelectorAll('.card'));
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.hidden = true;
    empty.textContent = 'No projects match your search.';
    grid.appendChild(empty);

    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      cards.forEach(card => {
        const match = card.textContent.toLowerCase().includes(q);
        card.hidden = !match;
        if (match) shown++;
      });
      empty.hidden = shown !== 0;
    });
  })();
</script>

</body>
</html>
