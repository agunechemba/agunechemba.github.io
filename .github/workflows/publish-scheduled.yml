name: Publish Scheduled Blog Posts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  publish-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish posts with today's date
        run: |
          TODAY=$(date +'%Y-%m-%d')
          POSTS_DIR="./_posts"
          
          FILES_TO_PUBLISH=$(find $POSTS_DIR \( -name "*.md" -o -name "*.markdown" \) 2>/dev/null | grep "$TODAY" || true)
          
          if [ -n "$FILES_TO_PUBLISH" ]; then
            echo "📝 Found files for today:"
            echo "$FILES_TO_PUBLISH"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            echo "$FILES_TO_PUBLISH" | xargs git add
            git commit -m "📅 Auto-publish posts for $TODAY"
            git push
            
            echo "✅ Published successfully!"
          else
            echo "⏳ No posts scheduled for $TODAY"
          fi
