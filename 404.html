<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Agunechemba</title>
    <style>
        :root {
            /* Primary brand colors */
            --primary-navy: #0f172a;
            --accent-yellow: #facc15; /* Bright Yellow */
            --accent-yellow-hover: #eab308; /* Darker Yellow on Hover */
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            padding: 60px 40px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
            max-width: 480px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }

        /* Profile/DP Styling */
        .profile-dp {
            width: 130px;
            height: 130px;
            margin: 0 auto 30px;
            display: block;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid var(--primary-navy);
            padding: 3px;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            color: var(--primary-navy);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
        }

        h2 {
            font-size: 26px;
            margin: 10px 0 20px;
            color: var(--primary-navy);
            font-weight: 700;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0 0 35px;
            line-height: 1.6;
        }

        /* Yellow Button Styling */
        .btn-yellow {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: #000;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(250, 204, 21, 0.3);
        }

        .btn-yellow:hover {
            background-color: var(--accent-yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -1px rgba(234, 179, 8, 0.4);
        }

        /* Subfooter Brand Name */
        .brand-footer {
            margin-top: 40px;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <!-- Display Picture -->
        <img src="https://agunechembaekene.wordpress.com/wp-content/uploads/2026/07/agunechemba_display_image_no-background-400h.png" alt="Agunechemba" class="profile-dp">
        
        <h1>404</h1>
        <h2>This path is missing.</h2>
        <p>The page you are looking for has either been moved, deleted, or never existed in the first place.</p>
        
        <!-- Yellow Button explicitly linking to https://agunechemba.name.ng/ -->
        <a href="https://agunechemba.name.ng/" class="btn-yellow">Return Home</a>
        
        <div class="brand-footer">AGUNECHEMBA</div>
    </div>
</body>
</html>
