<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · zen · Agunechemba</title>
    <style>
        /* ---------- ZEN PALETTE ---------- */
        :root {
            --bg-sand: #faf9f7;
            --bg-mist: #f1efe9;
            --ink: #2e2e2e;
            --ink-soft: #5e5e5e;
            --stone: #cbc7bd;
            --leaf: #8ba888;
            --leaf-deep: #6a8a6a;
            --paper: #ffffffd9;
        }

        /* ---------- GLOBAL RESET / RHYTHM ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 30% 20%, var(--bg-mist) 0%, var(--bg-sand) 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- CARD / ZEN GARDEN ---------- */
        .zen-card {
            max-width: 520px;
            width: 100%;
            background: var(--paper);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            padding: 56px 40px 48px;
            box-shadow: 
                0 30px 50px -20px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                0 0 0 1px rgba(0, 0, 0, 0.02);
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        /* soft hover – almost imperceptible */
        .zen-card:hover {
            box-shadow: 
                0 35px 55px -20px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 0 0 1px rgba(0, 0, 0, 0.02);
        }

        /* ---------- PORTRAIT / AVATAR ---------- */
        .portrait {
            width: 112px;
            height: 112px;
            margin: 0 auto 28px;
            display: block;
            object-fit: contain;
            border-radius: 50%;
            background: var(--bg-sand);
            padding: 6px;
            box-shadow: 
                0 6px 14px rgba(0, 0, 0, 0.03),
                0 0 0 1px var(--stone) inset;
            filter: grayscale(0.15) contrast(1.02);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .portrait:hover {
            filter: grayscale(0) contrast(1.05);
            transform: scale(1.01);
        }

        /* ---------- 404 : NUMBERS AS ART ---------- */
        .error-number {
            font-size: 92px;
            font-weight: 400;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--ink);
            opacity: 0.9;
            margin-bottom: 8px;
            font-feature-settings: "tnum";
            transition: opacity 0.3s;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* subtle brush-stroke underline (zen) */
        .error-number::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--leaf);
            opacity: 0.35;
            margin: 8px auto 0;
            border-radius: 4px;
        }

        /* ---------- HEADLINE ---------- */
        .headline {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--ink-soft);
            margin: 28px 0 14px;
            font-style: italic;
            opacity: 0.85;
        }

        /* ---------- MESSAGE ---------- */
        .message {
            font-size: 16px;
            font-weight: 350;
            color: var(--ink-soft);
            max-width: 360px;
            margin: 0 auto 36px;
            line-height: 1.7;
            opacity: 0.8;
            letter-spacing: 0.01em;
        }

        /* ---------- BUTTON / RETURN ---------- */
        .return-btn {
            display: inline-block;
            background: transparent;
            color: var(--ink);
            padding: 14px 38px;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 450;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            border: 1.5px solid var(--stone);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .return-btn:hover {
            border-color: var(--leaf);
            background: var(--leaf);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -12px rgba(107, 138, 106, 0.3);
            letter-spacing: 0.16em;
        }

        /* ---------- FOOTER SIGNATURE ---------- */
        .zen-signature {
            margin-top: 48px;
            font-size: 11px;
            font-weight: 400;
            color: #acaaa3;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .zen-signature:hover {
            opacity: 1;
        }

        /* ---------- GENTLE FLOATING (ZEN MOTION) ---------- */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0px); }
        }

        .zen-card {
            animation: float 7s ease-in-out infinite;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .zen-card {
                padding: 40px 24px 36px;
                border-radius: 32px;
            }

            .error-number {
                font-size: 72px;
            }

            .headline {
                font-size: 20px;
                margin-top: 24px;
            }

            .message {
                font-size: 15px;
                padding: 0 8px;
            }

            .portrait {
                width: 92px;
                height: 92px;
            }

            .return-btn {
                padding: 12px 28px;
                font-size: 13px;
                letter-spacing: 0.12em;
            }
        }

        /* reduce motion if preferred */
        @media (prefers-reduced-motion: reduce) {
            .zen-card {
                animation: none;
            }
            .return-btn {
                transition: none;
            }
            .portrait {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="zen-card">
        <!-- portrait / small dp — subtle & harmonious -->
        <img 
            src="https://agunechembaekene.wordpress.com/wp-content/uploads/2026/09/agunechemba-ekene-dp-small.png" 
            alt="Agunechemba Ekene" 
            class="portrait"
            loading="lazy"
        >
        
        <!-- large 404 with minimal brush underline -->
        <div class="error-number">404</div>
        
        <!-- headline : quiet, poetic -->
        <h2 class="headline">this path is missing</h2>
        
        <!-- gentle explanation -->
        <p class="message">
            The page you are looking for has drifted away —<br>
            moved, deleted, or never existed at all.
        </p>
        
        <!-- home link — calm, centered, minimal -->
        <a href="https://agunechemba.name.ng/" class="return-btn" aria-label="Return to homepage">
            return home
        </a>
        
        <!-- signature — whisper of the brand -->
        <div class="zen-signature">agunechemba</div>
    </div>
</body>
</html>
