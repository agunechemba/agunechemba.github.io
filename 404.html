<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Agunechemba</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .container {
            padding: 50px 40px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
            border-top: 5px solid var(--accent-color);
        }

        h1 {
            font-size: 80px;
            margin: 0;
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: -2px;
        }

        h2 {
            font-size: 22px;
            margin: 10px 0 15px;
            color: var(--primary-color);
        }

        p {
            font-size: 15px;
            color: #64748b;
            margin: 0 0 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .brand {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

</head>

    <div class="container">
        <h1>404</h1>
        <h2>Lost in the Code?</h2>
        <p>The page you are looking for might have been moved, deleted, or never existed in the first place.</p>
        <a href="https://agunechemba.name.ng/" class="btn">Return Home</a>
